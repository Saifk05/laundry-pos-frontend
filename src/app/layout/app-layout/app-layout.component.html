<div class="app-shell">

  <app-sidebar></app-sidebar>

  <div class="app-main">

    <header class="app-header">

      <div class="header-title">

        <strong>
          {{ settings.businessName || 'Venkateshwara Fabric Works' }}
        </strong>

        <span>
          {{ settings.headerSubtitle || 'Operations' }}
        </span>

      </div>

      <div class="header-actions">

        <button
          type="button"
          class="header-action">
          +
        </button>

        <button
          type="button"
          class="header-action">
          🚲
        </button>

        <button
          type="button"
          class="header-action refresh">
          ↻
        </button>

      </div>

    </header>

    <main class="app-content">
      <router-outlet></router-outlet>
    </main>

  </div>

</div>
