<aside class="sidebar">

  <!-- BRAND -->
  <div class="sidebar-brand">

    <div class="brand-mark">
      L
    </div>

    <div class="brand-text">

      <strong>
        LaundryFlow
      </strong>

      <span>
        Laundry POS
      </span>

    </div>

  </div>


  <!-- MENU -->
  <nav class="sidebar-menu">

    <!-- HOME -->
    <a
      routerLink="/app/dashboard"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="menu-item">

      <ion-icon name="home-outline"></ion-icon>

      <span>
        Home
      </span>

    </a>


    <!-- NEW WALK-IN -->
    <a
      routerLink="/app/new-walk-in"
      routerLinkActive="active"
      class="menu-item">

      <ion-icon name="walk-outline"></ion-icon>

      <span>
        New Walk-in
      </span>

    </a>


    <!-- PICKUP / DROP -->
    <a
      routerLink="/app/pickup-drop"
      routerLinkActive="active"
      class="menu-item">

      <ion-icon name="bicycle-outline"></ion-icon>

      <span>
        Pickup / Drop
      </span>

      <span class="new-badge">
        NEW
      </span>

    </a>


    <!-- B2C ORDER -->
    <a
      routerLink="/app/b2c-orders"
      routerLinkActive="active"
      class="menu-item">

      <ion-icon name="cart-outline"></ion-icon>

      <span>
        B2C Order
      </span>

    </a>


    <!-- VENDOR ORDER -->
    <a
      routerLink="/app/vendor-orders"
      routerLinkActive="active"
      class="menu-item">

      <ion-icon name="cart-sharp"></ion-icon>

      <span>
        As Vendor Order
      </span>

    </a>


    <!-- CLIENT ORDER -->
    <a
      routerLink="/app/client-orders"
      routerLinkActive="active"
      class="menu-item">

      <ion-icon name="person-add-outline"></ion-icon>

      <span>
        Client Order
      </span>

    </a>


    <!-- FAB CREDIT -->
    <a
      routerLink="/app/fab-credit"
      routerLinkActive="active"
      class="menu-item">

      <ion-icon name="wallet-outline"></ion-icon>

      <span>
        Fab Credit
      </span>

    </a>


    <!-- SETTLEMENT -->
    <a
      routerLink="/app/settlement"
      routerLinkActive="active"
      class="menu-item">

      <ion-icon name="checkmark-done-outline"></ion-icon>

      <span>
        Settlement
      </span>

    </a>


    <!-- BILL -->
    <a
      routerLink="/app/bill"
      routerLinkActive="active"
      class="menu-item">

      <ion-icon name="receipt-outline"></ion-icon>

      <span>
        Bill
      </span>

    </a>


    <!-- PAYMENT -->
    <a
      routerLink="/app/payments"
      routerLinkActive="active"
      class="menu-item">

      <ion-icon name="card-outline"></ion-icon>

      <span>
        Payment
      </span>

    </a>


    <!-- CHECK RZP PAYMENT -->
    <a
      routerLink="/app/check-payment"
      routerLinkActive="active"
      class="menu-item">

      <ion-icon name="card-outline"></ion-icon>

      <span>
        Check RZP Payment
      </span>

    </a>

  </nav>


  <!-- FOOTER -->
  <div class="sidebar-footer">

    <button
      type="button"
      class="logout-button"
      [disabled]="loggingOut"
      (click)="logout()">

      <ion-icon name="log-out-outline"></ion-icon>

      <span>

        @if (loggingOut) {

          Logging out...

        } @else {

          Logout

        }

      </span>

    </button>

  </div>

</aside>
