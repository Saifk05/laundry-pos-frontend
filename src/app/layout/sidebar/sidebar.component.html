<div class="sidebar">
  <div class="sidebar-profile">
    <div class="profile-avatar">
      @if (settings.logoUrl) {
        <img [src]="settings.logoUrl" alt="Business Logo">
      } @else {
        <ion-icon name="person"></ion-icon>
      }
    </div>

    <div class="profile-info">
      <strong class="profile-name">{{ settings.adminName || 'Admin' }}</strong>
      <span class="profile-code">{{ settings.adminSubtitle || 'Laundry' }}</span>

      <div class="profile-rating">
        <ion-icon name="star"></ion-icon>
        <ion-icon name="star"></ion-icon>
        <ion-icon name="star"></ion-icon>
        <ion-icon name="star"></ion-icon>
        <ion-icon name="star"></ion-icon>
      </div>
    </div>
  </div>

  <nav class="sidebar-menu">
    <a routerLink="/app/dashboard" routerLinkActive="active"
       [routerLinkActiveOptions]="{ exact: true }" class="menu-item">
      <ion-icon name="home-outline"></ion-icon>
      <span>Home</span>
    </a>

    <a routerLink="/app/new-walk-in" routerLinkActive="active" class="menu-item">
      <ion-icon name="walk-outline"></ion-icon>
      <span>New Walk-in</span>
    </a>

    <a routerLink="/app/b2c-orders" routerLinkActive="active" class="menu-item">
      <ion-icon name="cart-outline"></ion-icon>
      <span>B2C Order</span>
    </a>

    <a routerLink="/app/pickup" routerLinkActive="active" class="menu-item">
      <ion-icon name="bicycle-outline"></ion-icon>
      <span>Pickup</span>
    </a>

    <a routerLink="/app/inventory" routerLinkActive="active" class="menu-item">
      <ion-icon name="cube-outline"></ion-icon>
      <span>Inventory</span>
    </a>

    <a routerLink="/app/bill" routerLinkActive="active" class="menu-item">
      <ion-icon name="receipt-outline"></ion-icon>
      <span>Bill</span>
    </a>

    <a routerLink="/app/payments" routerLinkActive="active" class="menu-item">
      <ion-icon name="card-outline"></ion-icon>
      <span>Payment</span>
    </a>

    <a routerLink="/app/sales-report" routerLinkActive="active" class="menu-item">
      <ion-icon name="bar-chart-outline"></ion-icon>
      <span>Sales Report</span>
    </a>
  </nav>
</div>
