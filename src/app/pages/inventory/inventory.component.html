<div class="inventory-page">

  <div class="page-header">
    <div>
      <h1>Business Management</h1>

      <p>
        Manage services, pricing, coupons, charges and business settings
      </p>
    </div>
  </div>


  <div class="cards-grid">

    <button
      type="button"
      class="management-card"
      (click)="openServices()">

      <div class="card-icon">
        🧺
      </div>

      <div class="card-content">

        <h2>
          Services
        </h2>

        <p>
          Manage laundry products, variants,
          services and pricing.
        </p>

      </div>

      <div class="card-arrow">
        →
      </div>

    </button>


    <button
      type="button"
      class="management-card"
      (click)="openCoupons()">

      <div class="card-icon">
        🎟️
      </div>

      <div class="card-content">

        <h2>
          Coupons
        </h2>

        <p>
          Manage coupon codes,
          discounts and availability.
        </p>

      </div>

      <div class="card-arrow">
        →
      </div>

    </button>


    <button
      type="button"
      class="management-card"
      (click)="openExtraCharges()">

      <div class="card-icon">
        ₹
      </div>

      <div class="card-content">

        <h2>
          Extra Charges
        </h2>

        <p>
          Manage express service,
          home delivery and other charges.
        </p>

      </div>

      <div class="card-arrow">
        →
      </div>

    </button>


    <button
      type="button"
      class="management-card"
      (click)="openAdminPanel()">

      <div class="card-icon">
        ⚙️
      </div>

      <div class="card-content">

        <h2>
          Admin Panel
        </h2>

        <p>
          Manage business name,
          admin details and store branding.
        </p>

      </div>

      <div class="card-arrow">
        →
      </div>

    </button>

  </div>

</div>
